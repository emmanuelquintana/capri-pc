# Va en el repo PÚBLICO capri-pc como .github/workflows/build.yml: ahí los minutos de Actions son
# gratis sin límite. Saca el código del repo privado Capri-Desktop con un token de solo lectura
# (secreto CAPRI_DESKTOP_TOKEN en capri-pc), lo compila para Windows, Mac y Linux y, si se pide,
# publica el release en el mismo capri-pc. Solo se ejecuta a mano: Actions › Compilar › Run workflow.
name: Compilar

on:
  workflow_dispatch:
    inputs:
      rama:
        description: 'Rama de Capri-Desktop a compilar'
        default: main
      publicar:
        description: 'Publicar la versión de tauri.conf.json como release (solo cuando Emma lo diga)'
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            args: ''
          - os: macos-latest
            name: mac
            args: '--target universal-apple-darwin'
          - os: ubuntu-24.04
            name: linux
            args: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emmanuelquintana/Capri-Desktop
          ref: ${{ inputs.rama }}
          token: ${{ secrets.CAPRI_DESKTOP_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Lo que Linux necesita para compilarla
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libxcb1-dev libxcb-shm0-dev libxcb-render0-dev libxrandr-dev \
            libdbus-1-dev libpipewire-0.3-dev libwayland-dev libgbm-dev libegl1-mesa-dev clang patchelf file

      - name: Revisar que sus páginas tengan todos sus archivos
        run: node tools/check-web.mjs

      - name: Revisar el código
        working-directory: src-tauri
        run: cargo clippy --locked

      - name: Compilar el instalador
        run: npx --yes @tauri-apps/cli@2 build ${{ matrix.args }}

      - name: Guardar el instalador (Windows)
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: Capri-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Guardar el instalador (Mac)
        if: matrix.name == 'mac'
        uses: actions/upload-artifact@v4
        with:
          name: Capri-mac
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error

      - name: Guardar el instalador (Linux)
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: Capri-linux
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  # Solo cuando Emma dice «publica» (Actions › Compilar › Run workflow › publicar, o una etiqueta v1.2.3): junta los tres instaladores y
  # crea el release con las novedades de esa versión del CHANGELOG.
  release:
    if: inputs.publicar
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: emmanuelquintana/Capri-Desktop
          ref: ${{ inputs.rama }}
          token: ${{ secrets.CAPRI_DESKTOP_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publicar el release
        env:
          # aquí mismo, en capri-pc: basta el token de la ejecución
          GH_TOKEN: ${{ github.token }}
          DOWNLOADS: ${{ github.repository }}
          TAG: ''
        run: |
          [ -n "$TAG" ] || TAG="v$(node -p "require('./src-tauri/tauri.conf.json').version")"
          VERSION="${TAG#v}"
          grep -q "\"version\": \"$VERSION\"" src-tauri/tauri.conf.json || { echo "La etiqueta $TAG no coincide con la versión de tauri.conf.json"; exit 1; }
          awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{if(on)exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "Falta la sección ## $VERSION en CHANGELOG.md"; exit 1; }
          cat >> notes.md <<'TXT'

          ### Descargar

          - **Windows 10 y 11**: el archivo `_x64-setup.exe`.
          - **Mac** (Intel y Apple Silicon): el `.dmg`. Arrastra Capri a Aplicaciones; la primera vez, clic derecho › Abrir.
          - **Linux** (Ubuntu 24.04 o más nuevo): el `.deb` o el `.AppImage`. Para el control de música, instala `playerctl`.
          TXT
          sed -i 's/^          //' notes.md
          ls -la dist
          mapfile -t files < <(find dist -type f \( -name '*-setup.exe' -o -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' \))
          printf '%s\n' "${files[@]}"
          [ "${#files[@]}" -ge 4 ] || { echo "Faltan instaladores"; exit 1; }
          gh release create "$TAG" "${files[@]}" -R "$DOWNLOADS" \
            --title "Capri $VERSION" --notes-file notes.md --latest
